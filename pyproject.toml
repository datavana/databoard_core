[project]
name = "databoard-core"
version = "0.1.0"
description = "Core logic for the Databoard service"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
databoard_core = ["resources/prompts/*.txt", "resources/parser/*.ebnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
